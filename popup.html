<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Next Checkers Move</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #f8fafc;
      font-weight: 800;
      font-size: 14px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .elo-pill {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.15));
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 999px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 10px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
      color: #38bdf8;
    }
    .nav-btn.primary {
      grid-column: span 2;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: rgba(96, 165, 250, 0.5);
      color: #ffffff;
      font-size: 13px;
      padding: 10px;
    }
    .nav-btn.primary:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    .coord-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .coord-title {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .mini-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      user-select: none;
    }
    .sq.light { background: #e2e8f0; }
    .sq.dark {
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
    }
    .sq.dark:hover {
      background: #334155;
      color: #38bdf8;
    }
    .sq.dark.active {
      background: #0284c7;
      color: #ffffff;
    }
    .info-bar {
      margin-top: 7px;
      font-size: 11.5px;
      color: #cbd5e1;
      text-align: center;
      min-height: 18px;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://nextcheckersmove.com/" target="_blank" rel="noopener" class="brand">
      <img src="icon48.png" alt="Next Checkers Move">
      <span>Next Checkers Move</span>
    </a>
    <span class="elo-pill">⚡ 3400+ NNUE</span>
  </div>

  <div class="grid">
    <a href="https://nextcheckersmove.com/" target="_blank" rel="noopener" class="nav-btn primary">
      ♟️ Launch AI Checkers Solver &amp; Calculator
    </a>
    <a href="https://nextcheckersmove.com/puzzle.html" target="_blank" rel="noopener" class="nav-btn">
      🧩 Daily Puzzle
    </a>
    <a href="https://nextcheckersmove.com/play.html" target="_blank" rel="noopener" class="nav-btn">
      🤖 35 AI Bots
    </a>
    <a href="https://nextcheckersmove.com/openings.html" target="_blank" rel="noopener" class="nav-btn">
      📖 18 Openings
    </a>
    <a href="https://nextcheckersmove.com/review.html" target="_blank" rel="noopener" class="nav-btn">
      📊 Game Review
    </a>
  </div>

  <div class="coord-card">
    <div class="coord-title">
      <span>PDN 1–32 Interactive Reference Map</span>
      <span style="color:#38bdf8;">Tap a square</span>
    </div>
    <div id="mini-board" class="mini-board"></div>
    <div id="sq-info" class="info-bar">Tap any numbered dark square (1–32) to inspect coordinates</div>
  </div>

  <div class="footer">
    Powered by <a href="https://nextcheckersmove.com/" target="_blank" rel="noopener">nextcheckersmove.com</a> &bull; <a href="https://nextcheckersmove.com/rules.html" target="_blank" rel="noopener">10-Variant Rules</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
